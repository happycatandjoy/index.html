<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Camp Half-Blood: The Prophecy</title>

<style>

body{
background:#101820;
color:white;
font-family:Georgia,serif;
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

#story{
font-size:22px;
line-height:1.6;
margin-bottom:20px;
min-height:150px;
}

button{
display:block;
width:100%;
padding:15px;
margin:8px 0;
font-size:18px;
border:none;
border-radius:10px;
background:#3a6ea5;
color:white;
cursor:pointer;
}

button:hover{
background:#4f86c6;
}

</style>
</head>

<body>

<h1>🏕️ Camp Half-Blood: The Prophecy</h1>

<div id="story"></div>

<div id="choices"></div>

<script>

const story =
document.getElementById("story");

const choices =
document.getElementById("choices");

function show(text){
story.innerHTML=text;
}

function choice(options){

choices.innerHTML="";

for(const option of options){

const btn =
document.createElement("button");

btn.textContent =
option.text;

btn.onclick =
option.action;

choices.appendChild(btn);

}

}

window.onload = function(){

const save =
localStorage.getItem("campSave");

if(save){

game = JSON.parse(save);

show(`
🏕️ Welcome Back!

Name: ${game.name}

Godly Parent: ${game.parent}
`);

choice([

{
text:"▶ Continue Adventure",
action:startGame
},

{
text:"🗑 New Character",
action:characterCreation
}

]);

}
else{

characterCreation();

}

};


let game = {
name:"",
parent:"",
rememberMe:false
};

function characterCreation(){

show(`
🚨 TEST VERSION 🚨

If you can read this,
the new code loaded.
`);

choices.innerHTML = `
<input id="playerName"
placeholder="Name"
style="width:100%;padding:12px;font-size:18px;margin-bottom:10px;">

<button onclick="chooseParent('Poseidon')">
🔱 Poseidon
</button>

<button onclick="chooseParent('Athena')">
🦉 Athena
</button>

<button onclick="chooseParent('Apollo')">
☀️ Apollo
</button>

<button onclick="chooseParent('Hades')">
💀 Hades
</button>

<button onclick="randomCharacter()">
🎲 Random Character
</button>
`;

}

function chooseParent(parent){

game.parent = parent;

const enteredName =
document.getElementById("playerName").value;

game.name =
enteredName || "Demigod";

rememberMe();

}

function randomCharacter(){

const names = [
"Leo",
"Hazel",
"Jason",
"Piper",
"Nico",
"Annabeth",
"Alex"
];

const parents = [
"Poseidon",
"Athena",
"Apollo",
"Hades"
];

game.name =
names[Math.floor(Math.random()*names.length)];

game.parent =
parents[Math.floor(Math.random()*parents.length)];

rememberMe();

}

function rememberMe(){

show(`
Welcome ${game.name}!

Child of ${game.parent}.

Would you like the game to remember you?
`);

choice([

{
text:"✅ Remember Me",
action:function(){

localStorage.setItem(
"campSave",
JSON.stringify(game)
);

startGame();

}
},

{
text:"❌ No Thanks",
action:function(){

startGame();

}
}
const save =
localStorage.getItem("campSave");

if(save){

game = JSON.parse(save);

show(`
🏕️ Welcome Back!

Name: ${game.name}

Godly Parent: ${game.parent}
`);

choice([

{
text:"▶ Continue Adventure",
action:startGame
},

{
text:"🗑 New Character",
action:characterCreation
}

]);

}
else{

characterCreation();

}

};


}
}

]);

}


    
function startGame(){

show(`
Welcome ${game.name}!

Child of ${game.parent}.

The campfire crackles beneath the stars.

A glowing symbol appears above your head.

The entire camp gasps.

You have been claimed.

What do you do?
`);

choice([

{
text:"🔱 Raise your weapon proudly",
action:function(){

show(`
Campers cheer.

Chiron smiles.

"You may have potential."
`);

chapterTwo();

}
},

{
text:"😂 Ask if being claimed comes with blue cookies",
action:function(){

show(`
Several campers laugh.

One camper actually gives you a blue cookie.
`);

chapterTwo();

}
},

{
text:"🤫 Pretend nothing happened",
action:function(){

show(`
The campers stare.

Chiron looks confused.
`);

chapterTwo();

}
}

]);

}

function chapterTwo(){

choice([

{
text:"Continue",
action:function(){

show(`
CHAPTER 2

The next morning a satyr bursts into the Big House.

"A Pegasus is missing!"

Chiron points directly at you.

"This will be your first quest."

How do you begin?
`);

choice([

{
text:"🌲 Search the forest",
action:function(){

show(`
You enter the forest.

Huge hoofprints disappear into the trees.

Something chased the Pegasus.

Then...

you find a strange black symbol carved into a tree.

A Titan symbol.

TO BE CONTINUED...
`);

ending();

}
},

{
text:"🕵️ Question witnesses",
action:function(){

show(`
Campers report hearing growls.

One camper swears they saw glowing eyes.

Following the clues,

you discover a strange Titan symbol.

TO BE CONTINUED...
`);

ending();

}
},

{
text:"🔮 Visit the Oracle",
action:function(){

show(`
Green mist fills the cave.

The Oracle whispers:

"Feathers flee.

Horns follow.

The enemy comes."

Outside the cave,

you discover a Titan symbol.

TO BE CONTINUED...
`);

ending();

}
}

]);

}
}

]);

}

function ending(){

choice([

{
text:"End Demo",
action:function(){

show(`
🏕️ Thanks for playing!

You have completed Chapters 1 and 2.

Coming Next:

🕵️ Chapter 3: The Titan Traitor

🐍 Chapter 4: Medusa's Garden

👑 Multiple Endings

🔱 More Choices

💙 Friendship Routes
`);

choices.innerHTML="";

}
}

]);

}

</script>

</body>
</html>
